name: DeepCharts Levels

# Two cadences, one job.
#
#   morning  - build the NQ levels, commit them, post to the public gamma
#              channel and to the private crew channel. This is the daily
#              anchor and it posts whether or not anything moved.
#   intraday - every 30 minutes while the session is open, rebuild and post
#              to the private crew channel ONLY if a level actually moved.
#
# The intraday run deliberately does NOT commit levels/. The public file and
# the injector app that downloads it stay on their once-a-morning cadence -
# an intraday run rebuilds in the workspace, posts, and lets the runner throw
# the rebuild away. The only thing it commits is where it got to.
#
# The old 15-minute "gamma-check" poster was removed 2026-08-16. It announced
# wall and flip changes several times a day with no change detection; the
# guards in notify.js are what make an intraday cadence tolerable this time.

on:
  schedule:
    # The morning set: weekdays 12:30 UTC ~= 08:30 ET. This is the one that
    # commits levels/, builds the TradingView indicator and posts publicly.
    - cron: '30 12 * * 1-5'
    #
    # Everything else: every 30 minutes for the WHOLE CME week, because the
    # group trades the whole CME week. The old window was 13:00-20:59 UTC on
    # weekdays, which is NY hours only - it went quiet through every Asia and
    # London session, which is exactly when nobody was watching the PC either.
    #
    # CME futures run Sunday 18:00 ET through Friday 17:00 ET. In UTC that is
    # Sunday 22:00 through Friday 21:00 under EDT, an hour later under EST, so
    # the ranges below are deliberately one hour generous at each end. Posting
    # is NOT decided here - notify.js still requires a real change, 90 minutes
    # since the last post and a daily cap, so a wider cron buys freshness
    # rather than noise.
    #
    # Minutes 5 and 35, not 0 and 30, so an intraday run can never collide with
    # the 12:30 morning run and produce two builds in the same minute.
    - cron: '5,35 22-23 * * 0'       # Sunday open
    - cron: '5,35 * * * 1-4'         # Monday through Thursday, around the clock
    - cron: '5,35 0-22 * * 5'        # Friday through the close
  workflow_dispatch:
    inputs:
      morning:
        description: 'Post the full morning set, even if nothing moved'
        type: boolean
        default: false

permissions:
  contents: write

# Serialises every run. Two runs pushing at once is what produced a rebase
# conflict on 2026-08-16, and the intraday cadence makes that far likelier.
concurrency:
  group: gamma
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Which kind of run is this? A schedule identifies itself by its own cron
      # expression; a manual run uses the checkbox.
      - name: Decide the cadence
        id: cadence
        run: |
          if [ "${{ github.event.schedule }}" = "30 12 * * 1-5" ] \
          || [ "${{ inputs.morning }}" = "true" ]; then
            echo "morning=true" >> "$GITHUB_OUTPUT"
          else
            echo "morning=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the offline tests first
        # Bare `node --test`: passing a directory breaks on Node 24 and glob
        # arguments need Node 21+. A broken build must not publish a file that
        # people are downloading and putting on live charts.
        run: node --test

      - name: Build the levels file
        run: node build-levels.js

      # ----------------------------------------------------- morning only
      # The indicator is text built from the levels that just landed. Morning
      # only, for two reasons: the intraday runs deliberately do not commit
      # levels/, and a file people paste into TradingView should change once a
      # day rather than every thirty minutes. It runs here, before the crew
      # post, because friends-update.js attaches whatever this writes.
      - name: Build the TradingView indicator
        if: steps.cadence.outputs.morning == 'true'
        run: node build-pine.js

      - name: Commit the levels file
        if: steps.cadence.outputs.morning == 'true'
        run: |
          git add levels/ tradingview/
          if git diff --cached --quiet; then
            echo "Levels unchanged."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Levels for $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Post to the public channel with the levels file attached
        if: steps.cadence.outputs.morning == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node post-levels.js

      # ------------------------------------------- private crew channel
      # Runs on BOTH cadences. On the morning run it always posts; on an
      # intraday run notify.js decides, and mostly decides no.
      - name: Update the crew channel
        env:
          FRIENDS_BOT_TOKEN: ${{ secrets.FRIENDS_BOT_TOKEN }}
          FRIENDS_CHANNEL_ID: ${{ secrets.FRIENDS_CHANNEL_ID }}
          # The friends' server gets the indicator and nothing else - a level
          # list posted there once buried the download people came for. With
          # this set an intraday run has nothing new to send and stays quiet.
          FRIENDS_SCRIPT_ONLY: '1'
        run: node friends-update.js ${{ steps.cadence.outputs.morning == 'true' && '--morning' || '' }}

      # state/ holds two unrelated things: friends.json, which records what the
      # crew channel was last told, and basis.json, which records the last
      # NDX->NQ basis measured during cash hours. basis.json changes on almost
      # every run, so a blanket "Crew channel updated" message claimed a post
      # every 30 minutes while FRIENDS_BOT_TOKEN was unset and the crew bot had
      # never sent a single message. Name whichever actually changed.
      - name: Remember what this run recorded
        run: |
          git add state/ || true
          if git diff --cached --quiet; then
            echo "Nothing to record."
          else
            if git diff --cached --name-only | grep -q 'state/friends.json'; then
              MSG="Crew channel updated $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              MSG="Basis carried forward $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "$MSG"
            git pull --rebase --autostash
            git push
          fi
