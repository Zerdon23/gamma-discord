name: DeepCharts Levels

# One job, once each weekday morning: build the NQ levels file from free data,
# commit it, and post it to Discord with the file attached.
#
# The old 15-minute "gamma-check" poster was removed 2026-08-16. It announced
# call/put wall and flip changes several times a day; the morning post now
# carries those same walls plus the flip, the gamma shelves and the session
# levels, in one message with a file people can actually import.

on:
  schedule:
    - cron: '30 12 * * 1-5'   # weekdays 12:30 UTC ~= 08:30 ET
  workflow_dispatch: {}        # lets us run it manually to test

# Allow the job to commit the built levels file back to the repo
permissions:
  contents: write

concurrency:
  group: gamma
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the offline tests first
        # Bare `node --test`: passing a directory breaks on Node 24 and glob
        # arguments need Node 21+. A broken build must not publish a file that
        # people are downloading and putting on live charts.
        run: node --test

      - name: Build the levels file
        run: node build-levels.js

      - name: Commit the levels file
        run: |
          git add levels/
          if git diff --cached --quiet; then
            echo "Levels unchanged."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Levels for $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Post to Discord with the levels file attached
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node post-levels.js
